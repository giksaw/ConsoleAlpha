<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabinet: Game Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#151719;--rail:#101214;--line:#2a2d31;--text:#e8e5de;--mute:#8d9095;--hi:#e8e5de;--on:#151719;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Schibsted Grotesk",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.win{display:grid;grid-template-rows:34px 1fr;height:100vh}
.tb{display:flex;justify-content:space-between;align-items:center;background:var(--rail);border-bottom:1px solid var(--line);padding-left:14px;color:var(--mute);font-size:12px}
.tb i{display:flex}.tb i span{width:46px;height:34px;display:grid;place-items:center}.tb i span:hover{background:var(--line)}.tb i span:last-child:hover{background:#c0392b;color:#fff}
.body{display:grid;grid-template-columns:200px 1fr;min-height:0}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:18px 0;overflow:auto}
.rail h4{margin:18px 18px 6px;font-size:12px;font-weight:500;color:var(--mute)}
.rail h4:first-child{margin-top:0}
.ri{display:flex;justify-content:space-between;width:100%;padding:6px 18px;color:var(--mute);border-left:2px solid transparent;text-align:left}
.ri:hover{color:var(--text)}
.ri.on{color:var(--text);border-left-color:var(--hi);background:#ffffff08}
.ri em{font-style:normal;font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:14px;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line)}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0;flex:none}
.top .n{color:var(--mute);flex:none}
.q{flex:1;max-width:340px;margin-left:auto;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;padding:6px 2px}
.q:focus{outline:0;border-bottom-color:var(--hi)}
.q::placeholder{color:var(--mute)}
.sel{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:5px 8px;font:inherit}
.vt{display:flex;border:1px solid var(--line);border-radius:3px}
.vt button{padding:5px 10px;color:var(--mute)}.vt button.on{background:var(--hi);color:var(--on)}
.btn{background:var(--hi);color:var(--on);border-radius:3px;padding:8px 18px;font-weight:600}
.btn.o{background:none;color:var(--text);border:1px solid var(--line)}
.btn.o:hover{border-color:var(--text)}
.scroll{flex:1;overflow:auto;padding:24px 28px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px}
.g{text-align:left;display:block;width:100%}
.cv{aspect-ratio:2/3;border-radius:3px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px;font-weight:800;font-size:19px;line-height:1;letter-spacing:-.04em;box-shadow:0 0 0 1px #ffffff12 inset}
.g .play{position:absolute;right:8px;top:8px;background:var(--hi);color:var(--on);font-size:12px;font-weight:600;padding:5px 10px;border-radius:3px;opacity:0;transition:opacity .12s}
.g:hover .play,.g:focus-visible .play{opacity:1}
.g b{display:block;margin-top:8px;font-weight:600}
.g span{color:var(--mute);font-size:12.5px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:0 10px 8px}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);color:var(--mute)}
.tbl tr{cursor:pointer}.tbl tr:hover td{background:#ffffff08}
.tbl td:nth-child(2){color:var(--text);font-weight:600}
.tbl .th{width:30px;height:44px;border-radius:2px;display:block}
.tbl td:first-child{width:54px}
.r{text-align:right!important}
.empty{color:var(--mute);padding:40px 0}
.scrim{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--rail);border-left:1px solid var(--line);z-index:11;transform:translateX(100%);transition:transform .22s ease;overflow:auto;padding:28px}
.panel.on{transform:none}
.panel .cv{width:170px;font-size:22px;float:left;margin:0 20px 10px 0}
.panel h2{font-size:26px;letter-spacing:-.04em;font-weight:800;line-height:1.05;margin:0 0 6px}
.panel p{color:var(--mute);margin:0 0 14px}
.x{position:absolute;right:16px;top:12px;color:var(--mute);font-size:20px}
.acts{display:flex;gap:8px;clear:none}
dl{clear:both;margin:26px 0 0;display:grid;grid-template-columns:110px 1fr;gap:0}
dt,dd{margin:0;padding:9px 0;border-top:1px solid var(--line)}dt{color:var(--mute)}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;width:max-content}
.seg button{padding:4px 12px;color:var(--mute)}.seg button.on{background:var(--hi);color:var(--on)}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,92vw);background:var(--rail);border:1px solid var(--line);border-radius:4px;padding:26px;z-index:12;display:none}
.dlg.on{display:block}
.dlg h3{margin:0 0 4px;font-size:20px;letter-spacing:-.03em}
.fld{display:block;margin-top:16px;color:var(--mute);font-size:12.5px}
.fld .in{display:flex;gap:8px;margin-top:5px}
.fld input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:3px;color:var(--text);padding:8px 10px;font:inherit}
.fld input:focus{outline:0;border-color:var(--hi)}
.sec{max-width:760px}
.sec h2{font-size:15px;margin:30px 0 4px}.sec h2:first-child{margin-top:0}
.src{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.src b{font-weight:600}.src span{color:var(--mute);font-size:12.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7fd18b;margin-right:7px}.dot.off{background:#555}
.tg{width:36px;height:20px;border:1px solid var(--mute);border-radius:99px;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--mute);transition:all .15s}
.tg[aria-pressed=true]{background:var(--hi);border-color:var(--hi)}.tg[aria-pressed=true]::after{left:19px;background:var(--on)}
.pad{position:fixed;inset:0;background:#0b0c0d;z-index:20;display:none;flex-direction:column;padding:6vh 7vw 5vh}
.pad.on{display:flex}
.pad .hd{display:flex;justify-content:space-between;color:var(--mute);font-size:18px}
.pad .row{flex:1;display:flex;align-items:center;gap:2.2vw;overflow:hidden;padding-left:2vw}
.pad .it{flex:none;width:15vw;aspect-ratio:2/3;transition:all .2s;opacity:.4}
.pad .it .cv{width:100%;height:100%;font-size:1.6vw}
.pad .it.f{width:24vw;opacity:1}.pad .it.f .cv{font-size:2.6vw;box-shadow:0 0 0 4px var(--hi)}
.pad .info{display:flex;justify-content:space-between;align-items:flex-end}
.pad .info h2{font-size:clamp(34px,5vw,64px);font-weight:800;letter-spacing:-.05em;line-height:1;margin:0}
.pad .info p{color:var(--mute);font-size:18px;margin:8px 0 0}
.keys{display:flex;gap:26px;color:var(--mute);font-size:16px}
.keys b{display:inline-grid;place-items:center;width:28px;height:28px;border:1px solid var(--mute);border-radius:50%;margin-right:8px;color:var(--text);font-weight:600}
@media(max-width:760px){
.body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.rail{display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line)}
.rail h4{display:none}.ri{width:auto;white-space:nowrap;gap:8px;border-left:0;border-bottom:2px solid transparent;padding:10px 14px}
.ri.on{border-bottom-color:var(--hi)}
.top{flex-wrap:wrap;padding:12px 16px}.q{max-width:none;margin:0;flex-basis:100%;order:9}
.scroll{padding:18px 16px 40px}.tbl th:nth-child(n+4),.tbl td:nth-child(n+4){display:none}
.pad .it.f{width:42vw}.pad .it{width:22vw}
}
</style>
</head>
<body>
<div class="win">
 <div class="tb"><span>Cabinet</span><i><span>&minus;</span><span>&#9633;</span><span>&times;</span></i></div>
 <div class="body">
  <aside class="rail" id="rail"></aside>
  <div class="main">
   <div class="top" id="top"></div>
   <div class="scroll" id="sc"></div>
  </div>
 </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Game details"></aside>

<div class="dlg" id="dlg" role="dialog" aria-label="Add a game">
 <h3>Add a game</h3><span style="color:var(--mute)">For games that aren't in a store library.</span>
 <label class="fld">Executable<div class="in"><input value="D:\Games\Hollow\hollow.exe"><button class="btn o">Browse</button></div></label>
 <label class="fld">Name<div class="in"><input value="Hollow"></div></label>
 <label class="fld">Launch arguments<div class="in"><input placeholder="-windowed -nointro"></div></label>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:24px"><button class="btn o" id="dx">Cancel</button><button class="btn" id="dok">Add game</button></div>
</div>

<div class="pad" id="pad">
 <div class="hd"><span>Cabinet</span><span id="pc"></span></div>
 <div class="row" id="prow"></div>
 <div class="info"><div id="pinfo"></div><div class="keys"><span><b>A</b>Play</span><span><b>B</b>Back</span><span><b>Y</b>Favorite</span></div></div>
</div>

<script>
// title, store, genre, hours, last, size, fav, pattern, c1, c2, ink, year, blurb
const G=[
["Ashfall","Steam","Action",42,"Today","24 GB",1,0,"#d9482b","#f4c26b","#fff",2023,"Outrun a collapsing volcano in a fast, unforgiving platformer."],
["Tidepool","Steam","Puzzle",8,"Yesterday","3 GB",0,3,"#12355b","#5bc0de","#fff",2021,"Steer light through shifting underwater caves."],
["Nocturne","Epic","Adventure",18,"3 days ago","19 GB",1,2,"#2b1b3d","#c77dbb","#fff",2022,"A quiet night-time walk across a sleeping city."],
["Monolith","GOG","Strategy",96,"Last week","6 GB",0,4,"#26292e","#4b525c","#e8e5de",2019,"Build, trade and outlast rival civilizations."],
["Verdant","Steam","Simulation",31,"Last week","2 GB",1,0,"#1f5a3a","#bfe3a0","#fff",2020,"Grow a garden that remembers every season."],
["Kite","Epic","Racing",7,"2 weeks ago","11 GB",0,1,"#1b6ca8","#f4efe2","#fff",2024,"Race gliders through mountain thermals."],
["Foundry","Steam","Sandbox",210,"Today","8 GB",1,4,"#a8541b","#2b1b0f","#fff",2018,"Craft machines and automate everything."],
["Halcyon","GOG","RPG",64,"Last month","38 GB",1,3,"#7a2f5e","#f2b8c6","#fff",2022,"Ten strangers, one island, a very slow summer."],
["Static","Steam","Horror",5,"Last month","14 GB",0,2,"#141a20","#59707f","#e8e5de",2023,"Something is broadcasting from the empty station."],
["Orbit","Custom","Arcade",23,"Yesterday","310 MB",0,0,"#f2c230","#e0662b","#1b1b1b",2017,"Tiny planets, big gravity, one more try."],
["Lantern","Epic","Platformer",12,"2 months ago","4 GB",0,1,"#e8d9b5","#c9482b","#1b1b1b",2021,"A paper lantern, a long night, a very small ghost."],
["Hollow","Custom","Roguelike",3,"2 months ago","900 MB",0,4,"#0f1c1a","#2f6f5e","#e8e5de",2020,"Descend again. The cave rearranges itself every time."]
];
const $=s=>document.querySelector(s);
let flt="all",view="grid",q="",sort="recent",sel=-1,pg="lib",pi=0;
const bgf=g=>{const[a,b]=[g[8],g[9]];return[
`radial-gradient(circle at 72% 28%,${b} 0 24%,transparent 25%),linear-gradient(170deg,${a},${a})`,
`repeating-linear-gradient(115deg,${a} 0 22px,${b} 22px 26px)`,
`linear-gradient(160deg,${a} 58%,${b} 58%)`,
`radial-gradient(circle at 28% 72%,transparent 0 14%,${b} 15% 19%,transparent 20% 30%,${b} 31% 34%,transparent 35%),${a}`,
`radial-gradient(${b} 2px,transparent 2.6px) 0 0/16px 16px,${a}`][g[7]]};
const cv=(g,x="")=>`<div class="cv" style="background:${bgf(g)};color:${g[10]}">${x}<span style="position:relative;mix-blend-mode:normal;text-shadow:0 1px 8px #0006">${g[0]}</span></div>`;
const nav=[["all","All games"],["recent","Recently played"],["fav","Favorites"]];
const stores=["Steam","Epic","GOG","Custom"];
const cnt=f=>G.filter(g=>match(g,f)).length;
function match(g,f){return f==="all"||(f==="fav"&&g[6])||(f==="recent"&&/Today|Yesterday|days|Last week/.test(g[4]))||g[1]===f}
function rail(){$("#rail").innerHTML=`<h4>Library</h4>`+nav.map(([k,l])=>`<button class="ri ${pg==="lib"&&flt===k?"on":""}" data-f="${k}">${l}<em>${cnt(k)}</em></button>`).join("")+`<h4>Stores</h4>`+stores.map(s=>`<button class="ri ${pg==="lib"&&flt===s?"on":""}" data-f="${s}">${s}<em>${cnt(s)}</em></button>`).join("")+`<h4>App</h4><button class="ri ${pg==="set"?"on":""}" data-pg="set">Sources &amp; settings</button><button class="ri" data-pad>Controller mode</button>`}
function list(){let l=G.map((g,i)=>[g,i]).filter(([g])=>match(g,flt)&&g[0].toLowerCase().includes(q));
 if(sort==="az")l.sort((a,b)=>a[0][0].localeCompare(b[0][0]));if(sort==="hrs")l.sort((a,b)=>b[0][3]-a[0][3]);return l}
function lib(){
 const t={all:"All games",recent:"Recently played",fav:"Favorites"}[flt]||flt;
 $("#top").innerHTML=`<h1>${t}</h1><span class="n">${list().length}</span><input class="q" id="q" placeholder="Search games" value="${q}" aria-label="Search games"><select class="sel" id="so" aria-label="Sort"><option value="recent">Recently played</option><option value="az">A to Z</option><option value="hrs">Most played</option></select><div class="vt"><button data-v="grid" class="${view==="grid"?"on":""}">Grid</button><button data-v="list" class="${view==="list"?"on":""}">List</button></div><button class="btn o" id="add">Add game</button>`;
 $("#so").value=sort;
 const l=list();let h;
 if(!l.length)h=`<div class="empty">No games match "${q}". Check the spelling, or add it manually.</div>`;
 else if(view==="grid")h=`<div class="grid">`+l.map(([g,i])=>`<button class="g" data-i="${i}">${cv(g,'<span class="play" data-play="'+i+'">Play</span>')}<b>${g[0]}</b><span>${g[1]}, ${g[3]} h</span></button>`).join("")+`</div>`;
 else h=`<table class="tbl"><thead><tr><th></th><th>Title</th><th>Store</th><th class="r">Played</th><th>Last played</th><th class="r">Size</th><th></th></tr></thead><tbody>`+l.map(([g,i])=>`<tr data-i="${i}"><td><span class="th" style="background:${bgf(g)}"></span></td><td>${g[0]}</td><td>${g[1]}</td><td class="r">${g[3]} h</td><td>${g[4]}</td><td class="r">${g[5]}</td><td class="r"><button class="btn" data-play="${i}" style="padding:5px 14px">Play</button></td></tr>`).join("")+`</tbody></table>`;
 $("#sc").innerHTML=h;
 const qi=$("#q");qi.oninput=e=>{q=e.target.value.toLowerCase();const p=qi.selectionStart;lib();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
 $("#so").onchange=e=>{sort=e.target.value;lib()}}
function set(){
 $("#top").innerHTML=`<h1>Sources &amp; settings</h1>`;
 const s=(n,d,c,on)=>`<div class="src"><div><b><i class="dot ${on?"":"off"}"></i>${n}</b></div>${on?'<span>'+c+' games</span>':'<button class="btn o">Add</button>'}<span style="grid-column:1/-1">${d}</span></div>`;
 const t=(n,d,v)=>`<div class="src"><div><b>${n}</b></div><button class="tg" aria-pressed="${v}" aria-label="${n}"></button><span style="grid-column:1/-1">${d}</span></div>`;
 $("#sc").innerHTML=`<div class="sec"><h2>Detected stores</h2><div style="display:flex;align-items:center;justify-content:space-between"><span style="color:var(--mute)">Last scan 2 minutes ago, 12 games</span><button class="btn">Rescan now</button></div>`+
 s("Steam","C:\\Program Files (x86)\\Steam",5,1)+s("Epic Games","C:\\Program Files\\Epic Games",3,1)+s("GOG Galaxy","C:\\GOG Games",2,1)+
 `<h2>Other launchers</h2>`+s("Battle.net","Not found. Point Cabinet at the install folder.",0,0)+s("Xbox, EA App, Ubisoft Connect","Not found.",0,0)+s("Heroic and Lutris","Not found.",0,0)+
 `<h2>Behavior</h2>`+t("Scan on startup","Uses the saved library first, then refreshes in the background.",true)+t("Track play time","Notice when a game is running and count the session.",true)+t("Keep running in the tray","Closing the window doesn't quit Cabinet.",false)+t("Hide games I've removed","Keep uninstalled titles out of the library.",true)+`</div>`}
function show(){rail();pg==="lib"?lib():set()}
function panel(i){const g=G[i];sel=i;
 $("#panel").innerHTML=`<button class="x" id="px" aria-label="Close">&times;</button>${cv(g)}<h2>${g[0]}</h2><p>${g[1]}, ${g[2]}, ${g[11]}</p><p>${g[12]}</p><div class="acts"><button class="btn" data-play="${i}">Play</button><button class="btn o" id="fv">${g[6]?"Remove favorite":"Favorite"}</button></div>
 <dl><dt>Status</dt><dd><div class="seg" id="st"><button>Backlog</button><button class="on">Playing</button><button>Finished</button></div></dd><dt>Played</dt><dd>${g[3]} hours</dd><dt>Last played</dt><dd>${g[4]}</dd><dt>Install size</dt><dd>${g[5]}</dd><dt>Location</dt><dd style="word-break:break-all">${g[1]==="Steam"?"C:\\Program Files (x86)\\Steam\\steamapps\\common\\":"D:\\Games\\"}${g[0]}</dd><dt>Sessions</dt><dd>Today, 1 h 20 m<br><span style="color:var(--mute)">Sun, 2 h 05 m<br>Fri, 45 m</span></dd></dl>`;
 $("#panel").classList.add("on");$("#scrim").classList.add("on")}
const close=()=>{$("#panel").classList.remove("on");$("#dlg").classList.remove("on");$("#scrim").classList.remove("on")};
function pad(){const l=G;
 $("#prow").innerHTML=l.map((g,i)=>`<div class="it ${i===pi?"f":""}">${cv(g)}</div>`).join("");
 const g=l[pi];$("#pinfo").innerHTML=`<h2>${g[0]}</h2><p>${g[1]}, ${g[3]} hours played, last ${g[4].toLowerCase()}</p>`;$("#pc").textContent=(pi+1)+" of "+l.length;
 const f=$("#prow .f");f&&f.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})}
function toast(m){const t=document.createElement("div");t.textContent=m;t.style.cssText="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--hi);color:var(--on);padding:9px 18px;border-radius:3px;font-weight:600;z-index:30";document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
document.addEventListener("click",e=>{
 const p=e.target.closest("[data-play]");if(p){e.stopPropagation();return toast("Launching "+G[+p.dataset.play][0])}
 const r=e.target.closest(".ri");if(r){if(r.dataset.pad!==undefined){$("#pad").classList.add("on");return pad()}
  if(r.dataset.pg){pg="set"}else{pg="lib";flt=r.dataset.f;q=""}return show()}
 const v=e.target.closest("[data-v]");if(v){view=v.dataset.v;return lib()}
 const c=e.target.closest("[data-i]");if(c)return panel(+c.dataset.i);
 if(e.target.closest("#px")||e.target.id==="scrim"||e.target.id==="dx")return close();
 if(e.target.id==="add"){$("#dlg").classList.add("on");$("#scrim").classList.add("on")}
 if(e.target.id==="dok"){close();toast("Added Hollow")}
 if(e.target.id==="fv"){G[sel][6]^=1;panel(sel);show()}
 const sg=e.target.closest("#st button");if(sg){[...sg.parentNode.children].forEach(b=>b.classList.toggle("on",b===sg))}
 const tg=e.target.closest(".tg");if(tg)tg.setAttribute("aria-pressed",tg.getAttribute("aria-pressed")!=="true");
});
document.addEventListener("keydown",e=>{
 if($("#pad").classList.contains("on")){
  if(e.key==="ArrowRight")pi=Math.min(G.length-1,pi+1);else if(e.key==="ArrowLeft")pi=Math.max(0,pi-1);
  else if(e.key==="Enter")return toast("Launching "+G[pi][0]);else if(e.key==="Escape")return $("#pad").classList.remove("on");else return;
  e.preventDefault();pad()}
 else if(e.key==="Escape")close()});
show();
</script>
</body>
</html>
