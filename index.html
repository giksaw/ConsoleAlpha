<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game Console Alpha</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div class="win">
    <div class="body">
      <aside class="rail" id="rail"></aside>
      <div class="main">
        <div class="top" id="top"></div>
        <div class="scroll" id="sc"></div>
      </div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-label="Game details"></aside>

  <div class="menu" id="menu" role="menu" aria-label="Game options"></div>

  <div class="dlg" id="covdlg" role="dialog" aria-label="Set cover art">
    <h3>Cover art</h3><span style="color:var(--mute)">Use a local image file, paste a URL, or pick a suggestion.</span>
    <div class="covprev" id="cov-prev"></div>
    <label class="fld">Image URL<div class="in"><input id="cov-url" placeholder="https://example.com/cover.jpg"><button class="btn o" id="cov-find">Find artwork</button></div></label>
    <div class="sug" id="cov-sug"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
      <button class="btn o" id="cov-file">Choose file…</button>
      <button class="btn o" id="cov-search">Search the web</button>
      <button class="btn o" id="cov-reset">Reset to default</button>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:24px"><button class="btn o" id="cov-x">Cancel</button><button class="btn" id="cov-save">Save cover</button></div>
    <input type="file" id="cov-input" accept="image/*" style="display:none">
  </div>

  <div class="dlg" id="dlg" role="dialog" aria-label="Add a game">
    <h3>Add a game</h3><span style="color:var(--mute)">For games that aren't in a store library.</span>
    <label class="fld">Executable<div class="in"><input id="dlg-exe" placeholder="D:\Games\Hollow\hollow.exe"><button class="btn o" id="dlg-browse">Browse</button></div></label>
    <label class="fld">Name<div class="in"><input id="dlg-name" placeholder="Hollow"></div></label>
    <label class="fld">Artwork<div class="in"><input id="dlg-art" placeholder="Paste an image URL, or pick a suggestion below"><button class="btn o" id="dlg-find">Find artwork</button></div></label>
    <div class="sug" id="dlg-sug"></div>
    <label class="fld">Launch arguments<div class="in"><input id="dlg-args" placeholder="-windowed -nointro"></div></label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:24px"><button class="btn o" id="dx">Cancel</button><button class="btn" id="dok">Add game</button></div>
    <input type="file" id="dlg-file" style="display:none">
  </div>

  <div class="pad" id="pad">
    <div class="hd"><span>Game Console Alpha</span><span id="pc"></span></div>
    <div class="row" id="prow"></div>
    <div class="info"><div id="pinfo"></div><div class="keys"><span><b>A</b>Play</span><span><b>B</b>Back</span><span><b>Y</b>Favorite</span></div></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
