[package]
name = "game-launcher"
version = "0.1.0"
description = "Game Cabinet: one library for all your PC games"
authors = ["Gladson Mathew"]
edition = "2021"

[lib]
name = "game_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
walkdir = "2"
chrono = "0.4"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
